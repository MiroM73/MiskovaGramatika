<script>
// App zoom: Ctrl + mouse wheel and Ctrl + / Ctrl − / Ctrl 0 on a PC, a two-finger pinch on phones and tablets.
// Browser zoom cannot go below 100 % on a phone, so the app scales .wrap itself (CSS zoom, --z): the text reflows
// to the screen instead of needing sideways scrolling. The level is remembered; the button bottom right resets it.
(function(){
  const R=document.documentElement, MIN=0.5, MAX=2.5, KEY="gramatika-zoom";
  const clamp=v=>Math.min(MAX,Math.max(MIN,v));
  let z=1; try{z=clamp(+localStorage.getItem(KEY)||1)}catch(e){}
  function layout(){
    const w=R.clientWidth/z;
    R.classList.toggle("w-xs",w<=460); R.classList.toggle("w-s",w<=520);
    R.classList.toggle("w-m",w>=700); R.classList.toggle("w-l",w>=1000);
  }
  function apply(){
    R.style.setProperty("--z",z); layout();
    const b=document.getElementById("zr");
    if(b){b.hidden=z===1; b.textContent="🔍 "+Math.round(z*100)+" %"}
  }
  // Change the level and keep the point (cx, cy) on the screen roughly where it was
  function set(nz,cx,cy){
    nz=Math.round(clamp(nz)*100)/100; if(Math.abs(nz-1)<0.04) nz=1;
    if(nz===z) return;
    const r=nz/z, x=scrollX, y=scrollY;
    z=nz; apply();
    scrollTo((x+cx)*r-cx,(y+cy)*r-cy);
    try{z===1?localStorage.removeItem(KEY):localStorage.setItem(KEY,z)}catch(e){}
  }
  apply();
  addEventListener("resize",layout);
  addEventListener("DOMContentLoaded",()=>{
    const b=document.getElementById("zr");
    b.onclick=()=>set(1,innerWidth/2,0); apply();
  });
  addEventListener("wheel",e=>{
    if(!e.ctrlKey) return;
    e.preventDefault();
    const d=Math.max(-150,Math.min(150,e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?400:1)));
    set(z*Math.exp(-d/500),e.clientX,e.clientY);
  },{passive:false});
  addEventListener("keydown",e=>{
    if(!(e.ctrlKey||e.metaKey)||e.altKey) return;
    const k=e.key, c=[innerWidth/2,innerHeight/2];
    if(k==="+"||k==="="||k==="Add"){e.preventDefault();set(z*1.1,...c)}
    else if(k==="-"||k==="_"||k==="Subtract"){e.preventDefault();set(z/1.1,...c)}
    else if(k==="0"){e.preventDefault();set(1,...c)}
  });
  // Pinch: the zoom follows the change of the distance between two fingers; one update per frame
  let pin=null, raf=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  addEventListener("touchstart",e=>{if(e.touches.length===2) pin={d:dist(e.touches)||1,z}},{passive:true});
  addEventListener("touchmove",e=>{
    if(!pin||e.touches.length!==2) return;
    e.preventDefault();
    const t=e.touches, nz=pin.z*dist(t)/pin.d, cx=(t[0].clientX+t[1].clientX)/2, cy=(t[0].clientY+t[1].clientY)/2;
    cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>set(nz,cx,cy));
  },{passive:false});
  const end=e=>{if(e.touches.length<2) pin=null};
  addEventListener("touchend",end); addEventListener("touchcancel",end);
  // iOS Safari zooms the page on its own gesture events even with touch-action
  ["gesturestart","gesturechange"].forEach(t=>addEventListener(t,e=>e.preventDefault(),{passive:false}));
  self.appZoom={set,get:()=>z};
})();
</script>
<style>
/* Layout: a tab switch, a topic picker, a step rail, one exercise card at a time; one column on phones, picker beside the card on wide screens */
:root{
  --bg:#f1eefb; --surface:#ffffff; --ink:#1f1b33; --muted:#5f5a78; --line:#dcd6ef;
  --accent:#6a4bd6; --accent-soft:#ece6fd; --sun:#f3ad00; --sun-soft:#fff3cf;
  --ok:#17905a; --ok-soft:#ddf4e8; --bad:#cf3b3b; --bad-soft:#fbe4e4;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111e; --surface:#1d1a2b; --ink:#ece9f8; --muted:#a39dbc; --line:#2f2a45;
  --accent:#a58cff; --accent-soft:#2a2347; --sun:#f2c14e; --sun-soft:#3a3016;
  --ok:#40c785; --ok-soft:#173527; --bad:#ff7070; --bad-soft:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111e; --surface:#1d1a2b; --ink:#ece9f8; --muted:#a39dbc; --line:#2f2a45;
  --accent:#a58cff; --accent-soft:#2a2347; --sun:#f2c14e; --sun-soft:#3a3016;
  --ok:#40c785; --ok-soft:#173527; --bad:#ff7070; --bad-soft:#3d1d1f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.st{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);min-width:0}
.st b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.1;color:var(--ink)}
.st.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.st.done{border-color:var(--ok);background:var(--ok-soft)}
.w-s .rail{grid-template-columns:repeat(3,1fr)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.2}
.card > p{margin:0}
.hint{color:var(--muted);margin:0}
.src{color:var(--accent);font-weight:800;font-size:.9rem;margin:-10px 0 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.sent{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,4.8vw,1.85rem);text-align:center;line-height:1.3;padding:6px 0;overflow-wrap:anywhere;margin:0}
.sent.sk{font-size:clamp(1.2rem,4.2vw,1.6rem)}
.gap{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);color:var(--accent);padding:0 .15em}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.skl{text-align:center;color:var(--muted);font-weight:700;margin:-8px 0 0}
.lbl{display:block;text-align:center;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.clue{align-self:center;border-radius:999px;padding:4px 16px;font-weight:800;font-size:1.05rem}
.clue.y{background:var(--ok-soft);color:var(--ok)}
.clue.n{background:var(--bad-soft);color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.w-xs .opts{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-weight:700;font-size:1.05rem;min-height:52px}
.opts.one .opt{text-align:left;padding-inline:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.sun{background:var(--sun);color:#1f1b33}
.btn:disabled{opacity:.5}
.fb{border-radius:14px;padding:12px 14px;font-weight:700;text-align:center}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.note{background:var(--sun-soft);color:var(--ink)}
.fb span{color:var(--ink)}
.fb small{display:block;color:var(--muted);font-weight:700}
.speak{border:3px solid var(--accent);background:var(--accent-soft);border-radius:999px;padding:14px 26px 14px 20px;margin:0 auto;display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink)}
.speak:hover{background:var(--accent);color:#fff}
.speak:hover svg{fill:#fff}
.speak svg{width:44px;height:44px;fill:var(--accent);flex:none}
.btn svg{width:20px;height:20px;fill:currentColor;vertical-align:-4px;margin-right:6px}
.line{min-height:58px;border-bottom:3px solid var(--accent);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:6px 0}
.line .end{font-family:var(--display);font-weight:800;font-size:1.3rem}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:800;font-size:1.1rem;min-height:46px}
.line .wt{background:var(--accent-soft);border-color:var(--accent)}
.wt:disabled{opacity:.25}
input[type=text]{font:inherit;font-size:1.2rem;font-weight:700;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.p1::before{content:"! ";color:var(--bad)}.chip.p2::before{content:"• ";color:var(--sun)}.chip.p3::before{content:"✔ ";color:var(--ok)}
.st.p1 b::after{content:" !";color:var(--bad)}.st.p3 b::after{content:" ✔";color:var(--ok)}
.prog{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.prog span{border-radius:8px;padding:2px 8px;font-weight:700;font-size:.9rem;background:var(--bg)}
.prog .p1{background:var(--bad-soft);color:var(--bad)}.prog .p2{background:var(--sun-soft)}.prog .p3{background:var(--ok-soft);color:var(--ok)}
.fs{display:flex;flex-direction:column;gap:8px}
.fs h3{margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-size:3rem;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px}
.list span{background:var(--bad-soft);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.95rem}
.words{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:0}
.words div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0;font-size:.95rem}
.words div b{font-weight:800}
.words div span{color:var(--muted);text-align:right}
.w-s .words{grid-template-columns:1fr}
.rt{display:flex;flex-direction:column;gap:6px}
.rr{display:grid;grid-template-columns:3.6em 1fr;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);text-align:left;width:100%}
.rr:hover{border-color:var(--accent)}
.rr > b{font-family:var(--display);font-size:1.1rem;color:var(--accent)}
.rr .e{display:block;font-weight:800;font-size:1.05rem}
.rr .s{display:block;color:var(--muted);font-size:.9rem}
.tw{overflow-x:auto}
.cmp{width:100%;border-collapse:separate;border-spacing:0 6px}
.cmp th{font-family:var(--display);color:var(--accent);text-align:left;padding:2px 8px;font-size:1rem}
.cmp thead th{color:var(--muted);font-family:var(--body);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.cmp td{padding:0 4px;vertical-align:top}
.say{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-weight:800;text-align:left;width:100%}
.say:hover{border-color:var(--accent)}
.no{display:block;color:var(--bad);font-weight:700;font-size:.9rem;padding:6px 10px}
.tip{background:var(--sun-soft);border-left:5px solid var(--sun);border-radius:10px;padding:10px 14px}
.tip p{margin:4px 0}
.tip s,.card s{color:var(--bad)}
details summary{cursor:pointer;font-weight:800;color:var(--accent)}
details[open] summary{margin-bottom:10px}
details .fs{margin-bottom:12px}
.upd{background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.upd p{margin:0;flex:1 1 220px;font-weight:700}
.upd .row{justify-content:flex-start}
.news{flex:1 1 100%;display:flex;flex-direction:column;gap:6px}
.news h3{margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.news b{font-family:var(--display);font-size:1.05rem}
.news ul{margin:2px 0 0;padding-left:22px}
.scene{font-family:var(--display);font-weight:800;font-size:1.25rem;text-align:center;white-space:pre-line;line-height:1.5;margin:0;padding:10px;border-radius:14px;background:var(--sun-soft);overflow-wrap:anywhere}
/* Widths: the zoom script below sets w-xs (≤460px), w-s (≤520px), w-m (≥700px) and w-l (≥1000px) on <html>
   from the screen width divided by the app zoom, so zooming in on a PC switches to the phone layout like browser zoom does.
   Tablet and PC get more room around the column; from w-l the topic picker becomes a sticky left sidebar. */
.wrap{zoom:var(--z,1)}
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
#app{display:flex;flex-direction:column;gap:18px}
.w-m .wrap{padding-inline:24px;padding-block:32px 56px}
.w-m .card{padding:26px}
.w-l .wrap{max-width:1200px;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:20px 32px;align-items:start}
.w-l .wrap > header,.w-l .wrap > .upd,.w-l .wrap > .tabs{grid-column:1/-1}
.w-l #pick{position:sticky;top:calc((env(safe-area-inset-top,0px) + 16px) / var(--z,1));max-height:calc((100vh - 32px) / var(--z,1));overflow-y:auto;
  background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.w-l #pick .chip{background:var(--bg)}
.w-l .wrap:has(> #pick[hidden]) .stage{grid-column:1/-1;max-width:900px;width:100%}
/* The pinch is handled by the app, not the browser */
html{touch-action:pan-x pan-y}
.zr{position:fixed;z-index:10;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 7px;
  font-size:.7rem;font-weight:800;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Miškova gramatika</h1>
    <p class="sub">3. ročník · gramatika z učebnice, Unit 1–10 · <span id="ver"></span></p>
  </header>
  <div id="upd" class="upd" role="status" hidden></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-learn" aria-selected="true">Učebnica</button>
    <button class="tab" role="tab" id="t-rev" aria-selected="false">Opakovanie</button>
  </div>
  <div id="pick" class="fs"></div>
  <div class="stage">
    <div id="rail" class="rail"></div>
    <main id="app"></main>
  </div>
</div>

<button id="zr" class="zr" aria-label="Vrátiť veľkosť na 100 %" title="Vrátiť veľkosť na 100 %" hidden></button>

<script src="app.js"></script>
<script>
// Offline support: the service worker keeps a copy of the app on the phone.
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{}));

// Update check: compare this copy's version with the online version.js; offer an update when the online one is newer.
const VERSION=self.APP_VERSION||"";
document.getElementById("ver").textContent=VERSION?"verzia "+VERSION:"";
const newer=(a,b)=>{const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
let updLater=false;
async function checkUpdate(){
  if(!VERSION||updLater||!navigator.onLine) return;
  try{
    const r=await fetch("version.js?check="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    // Run the online copy of our own version.js against a plain object to read its version and changelog
    const o={}; new Function("self",await r.text())(o);
    if(o.APP_VERSION&&newer(o.APP_VERSION,VERSION)) showUpdate(o.APP_VERSION,(o.CHANGELOG||[]).filter(e=>newer(e.version,VERSION)));
  }catch(e){}
}
function showUpdate(online,changes){
  const box=document.getElementById("upd"); box.innerHTML="";
  const go=$("button",{class:"btn sun",onclick:async()=>{
    go.disabled=true; go.textContent="Aktualizujem…";
    try{
      const reg=await navigator.serviceWorker?.getRegistration();
      if(reg){
        await reg.update();
        const sw=reg.installing||reg.waiting;
        if(sw) await new Promise(ok=>{const t=setTimeout(ok,15000);sw.addEventListener("statechange",()=>{if(sw.state==="activated"||sw.state==="redundant"){clearTimeout(t);ok()}})});
      }
    }catch(e){}
    location.reload();
  }},"Aktualizovať");
  box.append($("p",{},"Je dostupná nová verzia "+online+" (máš "+VERSION+")."));
  if(changes.length) box.append($("div",{class:"news"},$("h3",{},"Čo je nové"),
    changes.map(e=>$("div",{},$("b",{},"Verzia "+e.version),$("ul",{},e.changes.map(t=>$("li",{},t)))))));
  box.append($("div",{class:"row"},go,$("button",{class:"btn ghost",onclick:()=>{updLater=true;box.hidden=true}},"Neskôr")));
  box.hidden=false;
}
addEventListener("load",checkUpdate);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
</script>
</body></html>
